name: Deploy changed site files to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-upload-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload changed site files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /velmorabank.us
        run: |
          set -euo pipefail

          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing FTP secrets"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- \
            ':(exclude).git/**' \
            ':(exclude).github/**' \
            ':(exclude).vscode/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)archive/**')"

          if [ -z "$changed_files" ]; then
            echo "No changed deployable files to upload."
            exit 0
          fi

          echo "Uploading changed files to ftp://$FTP_SERVER$REMOTE_DIR/"
          while IFS= read -r relative_path; do
            [ -z "$relative_path" ] && continue
            [ -f "$relative_path" ] || continue

            remote_path="$REMOTE_DIR/$relative_path"
            remote_dir="$(dirname "$remote_path")"

            echo "Uploading: $relative_path -> $remote_path"
            curl --silent --show-error --fail \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs \
              -T "$relative_path" \
              "ftp://$FTP_SERVER$remote_dir/"
          done <<< "$changed_files"
