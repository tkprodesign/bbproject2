name: Deploy changed site files to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-upload-site:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      REMOTE_DIR: ${{ secrets.SSH_DEPLOY_PATH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure encrypted SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USER SSH_PORT REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Required SSH setting is missing: $name"
              exit 1
            fi
          done

          case "$SSH_PRIVATE_KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-*)
              echo "SSH_PRIVATE_KEY contains a public key; the private key is required."
              exit 1
              ;;
          esac

          mkdir -p ~/.ssh

          if [[ "$SSH_PRIVATE_KEY" == *'\n'* ]]; then
            printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          else
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          fi

          while [ -s ~/.ssh/github-deploy ] && [ -z "$(head -n 1 ~/.ssh/github-deploy | tr -d '[:space:]')" ]; do
            sed -i '1d' ~/.ssh/github-deploy
          done

          first_line="$(head -n 1 ~/.ssh/github-deploy)"
          last_line="$(tail -n 1 ~/.ssh/github-deploy)"
          if [[ "$first_line" == '"-----BEGIN '* ]] && [[ "$last_line" == *'-----"' ]]; then
            sed -i '1s/^"//' ~/.ssh/github-deploy
            sed -i '$s/"$//' ~/.ssh/github-deploy
          fi

          if ! head -n 1 ~/.ssh/github-deploy | grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----$'; then
            compact="$(tr -d '[:space:]' < ~/.ssh/github-deploy)"
            if [[ "$compact" == b3BlbnNzaC1rZXktdjE* ]]; then
              {
                echo '-----BEGIN OPENSSH PRIVATE KEY-----'
                printf '%s' "$compact" | fold -w 70
                echo
                echo '-----END OPENSSH PRIVATE KEY-----'
              } > ~/.ssh/github-deploy.normalized
              mv ~/.ssh/github-deploy.normalized ~/.ssh/github-deploy
            fi
          fi

          chmod 600 ~/.ssh/github-deploy

          if ! head -n 1 ~/.ssh/github-deploy | grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----$'; then
            echo "SSH_PRIVATE_KEY is not in a recognized private-key format. Re-save the complete private key, including BEGIN and END lines."
            exit 1
          fi

          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          ASKPASS="$RUNNER_TEMP/ssh-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\\n" "$SSH_PASSPHRASE"' > "$ASKPASS"
          chmod 700 "$ASKPASS"

          SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add ~/.ssh/github-deploy </dev/null
          ssh-add -l >/dev/null

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection and deploy path
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "test -d \"$REMOTE_DIR\" && test -w \"$REMOTE_DIR\" && echo 'SSH connection and deploy path verified'"

      - name: Count registered users
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd \"$REMOTE_DIR\" && php -r 'require \"common-sections/app.php\"; \$db=connectToDatabase(); \$r=\$db->query(\"SELECT COUNT(*) AS c FROM users\"); \$row=\$r->fetch_assoc(); echo \"REGISTERED_USERS=\".\$row[\"c\"].PHP_EOL;'"

      - name: Upload changed site files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- \
            ':(exclude).git/**' \
            ':(exclude).github/**' \
            ':(exclude).vscode/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)archive/**')"

          if [ -z "$changed_files" ]; then
            echo "No changed deployable files to upload."
            exit 0
          fi

          while IFS= read -r relative_path; do
            [ -z "$relative_path" ] && continue
            [ -f "$relative_path" ] || continue

            remote_path="$REMOTE_DIR/$relative_path"
            remote_parent="$(dirname "$remote_path")"

            echo "Uploading: $relative_path"
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$remote_parent\""
            scp -q -P "$SSH_PORT" "$relative_path" "$SSH_USER@$SSH_HOST:$remote_path"
          done <<< "$changed_files"
