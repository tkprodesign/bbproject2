name: Deploy changed site files to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-upload-site:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_USER_PASSWORD: ${{ secrets.DB_USER_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure encrypted SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USER SSH_PORT; do
            if [ -z "${!name:-}" ]; then
              echo "Required SSH setting is missing: $name"
              exit 1
            fi
          done

          case "$SSH_PRIVATE_KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-*)
              echo "SSH_PRIVATE_KEY contains a public key; the private key is required."
              exit 1
              ;;
          esac

          mkdir -p ~/.ssh

          if [[ "$SSH_PRIVATE_KEY" == *'\n'* ]]; then
            printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          else
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          fi

          while [ -s ~/.ssh/github-deploy ] && [ -z "$(head -n 1 ~/.ssh/github-deploy | tr -d '[:space:]')" ]; do
            sed -i '1d' ~/.ssh/github-deploy
          done

          first_line="$(head -n 1 ~/.ssh/github-deploy)"
          last_line="$(tail -n 1 ~/.ssh/github-deploy)"
          if [[ "$first_line" == '"-----BEGIN '* ]] && [[ "$last_line" == *'-----"' ]]; then
            sed -i '1s/^"//' ~/.ssh/github-deploy
            sed -i '$s/"$//' ~/.ssh/github-deploy
          fi

          if ! head -n 1 ~/.ssh/github-deploy | grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----$'; then
            compact="$(tr -d '[:space:]' < ~/.ssh/github-deploy)"
            if [[ "$compact" == b3BlbnNzaC1rZXktdjE* ]]; then
              {
                echo '-----BEGIN OPENSSH PRIVATE KEY-----'
                printf '%s' "$compact" | fold -w 70
                echo
                echo '-----END OPENSSH PRIVATE KEY-----'
              } > ~/.ssh/github-deploy.normalized
              mv ~/.ssh/github-deploy.normalized ~/.ssh/github-deploy
            fi
          fi

          chmod 600 ~/.ssh/github-deploy

          if ! head -n 1 ~/.ssh/github-deploy | grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----$'; then
            echo "SSH_PRIVATE_KEY is not in a recognized private-key format. Re-save the complete private key, including BEGIN and END lines."
            exit 1
          fi

          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          ASKPASS="$RUNNER_TEMP/ssh-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\\n" "$SSH_PASSPHRASE"' > "$ASKPASS"
          chmod 700 "$ASKPASS"

          SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add ~/.ssh/github-deploy </dev/null
          ssh-add -l >/dev/null

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Discover live app root
        run: |
          set -euo pipefail
          LIVE_APP_ROOT="$(ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'LOGIN_FILE=$(find "$HOME" -maxdepth 7 -type f -path "*/velmorabank.us/login/index.php" 2>/dev/null | head -n 1); [ -n "$LOGIN_FILE" ] || exit 1; printf "%s" "${LOGIN_FILE%/login/index.php}"')"
          if [ -z "$LIVE_APP_ROOT" ]; then
            echo "Could not locate the live Velmora application root."
            exit 1
          fi
          echo "LIVE_APP_ROOT=$LIVE_APP_ROOT" >> "$GITHUB_ENV"
          echo "LIVE_APP_ROOT_DISCOVERED=YES"

      - name: Sync live database config
        run: |
          set -euo pipefail
          for name in DB_NAME DB_USERNAME DB_USER_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required database secret is missing: $name"
              exit 1
            fi
          done

          DB_NAME="$DB_NAME" DB_USERNAME="$DB_USERNAME" DB_USER_PASSWORD="$DB_USER_PASSWORD" php -r '
            $cfg = [
              "host" => "localhost",
              "port" => 3306,
              "user" => getenv("DB_USERNAME"),
              "password" => getenv("DB_USER_PASSWORD"),
              "name" => getenv("DB_NAME"),
              "socket" => ""
            ];
            file_put_contents($argv[1], json_encode($cfg, JSON_UNESCAPED_SLASHES));
          ' "$RUNNER_TEMP/velmora-db.json"

          chmod 600 "$RUNNER_TEMP/velmora-db.json"
          remote_db_tmp=".velmora-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.tmp"
          scp -q -P "$SSH_PORT" "$RUNNER_TEMP/velmora-db.json" "$SSH_USER@$SSH_HOST:$remote_db_tmp"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mv \"\$HOME/$remote_db_tmp\" \"\$HOME/.velmora-db.json\" && chmod 600 \"\$HOME/.velmora-db.json\""

      - name: Count registered Velmora users
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/velmora-count.php" <<'PHP'
          <?php
          require getcwd() . '/common-sections/app.php';
          $db = connectToDatabase();
          $r = $db->query('SELECT COUNT(*) AS c FROM users');
          $row = $r->fetch_assoc();
          echo 'REGISTERED_USERS=' . $row['c'] . PHP_EOL;
          PHP
          scp -q -P "$SSH_PORT" "$RUNNER_TEMP/velmora-count.php" "$SSH_USER@$SSH_HOST:velmora-count.php"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd '$LIVE_APP_ROOT'; php '\$HOME/velmora-count.php'; rm -f '\$HOME/velmora-count.php'"

      - name: Locate private environment files
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'find "$HOME" -maxdepth 4 -type f \( -name ".env" -o -name "*.env" \) -printf "%p\n" 2>/dev/null | sed "s#^$HOME#~#"'

      - name: Sync private staff mail environment
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            ENV_FILE="$(find "$HOME" -maxdepth 5 -type f \( -name ".env" -o -name "*.env" \) 2>/dev/null | head -n 1)"
            if [ -z "$ENV_FILE" ]; then
              echo "PRIVATE_STAFF_ENV=NOT_FOUND"
              exit 0
            fi

            tmp="$HOME/.velmora-backend.env.tmp"
            awk -F= '"'"'
              /^[[:space:]]*(SUPPORT_EMAIL|SUPPORT_EMAIL_PASSWORD|ADMIN_EMAIL|ADMIN_EMAIL_PASSWORD|DEVELOPER_EMAIL|DEVELOPER_EMAIL_PASSWORD|SECURITY_EMAIL_PASSWORD|NOREPLY_EMAIL_PASSWORD|IMAP_HOST|IMAP_PORT|SMTP_HOST|SMTP_PORT|SMTP_USERNAME|SMTP_PASSWORD|SMTP_ENCRYPTION)[[:space:]]*=/ {
                key=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                sub(/^[^=]*=/, "", $0)
                print key "=" $0
              }
            '"'"' "$ENV_FILE" > "$tmp"

            if [ ! -s "$tmp" ]; then
              rm -f "$tmp"
              echo "PRIVATE_STAFF_ENV=NO_MATCHING_KEYS"
              exit 0
            fi

            mv "$tmp" "$HOME/.velmora-backend.env"
            chmod 600 "$HOME/.velmora-backend.env"
            echo "PRIVATE_STAFF_ENV=READY"
          '

      - name: Check staff mail runtime
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            php -r '"'"'echo function_exists("imap_open") ? "IMAP_RUNTIME=READY\n" : "IMAP_RUNTIME=MISSING\n";'"'"'
          '

      - name: Lint PHP files
        run: |
          set -euo pipefail
          find . -path './archive' -prune -o -path './docs/archive' -prune -o -path './PHPMailer' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo "PHP_LINT_OK=YES"

      - name: Upload changed site files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- \
            ':(exclude).git/**' \
            ':(exclude).github/**' \
            ':(exclude).vscode/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)archive/**' \
            ':(exclude)docs/archive/**')"

          if [ -z "$changed_files" ]; then
            echo "No changed deployable files to upload."
            exit 0
          fi

          while IFS= read -r relative_path; do
            [ -z "$relative_path" ] && continue
            [ -f "$relative_path" ] || continue

            remote_path="$LIVE_APP_ROOT/$relative_path"
            remote_parent="$(dirname "$remote_path")"

            echo "Uploading: $relative_path"
            ssh -n -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$remote_parent\""
            scp -q -P "$SSH_PORT" "$relative_path" "$SSH_USER@$SSH_HOST:$remote_path" </dev/null
          done <<< "$changed_files"

      - name: Sync multi-currency application files
        run: |
          set -euo pipefail
          core_files=(
            "common-sections/app.php"
            "common-sections/header.php"
            "common-sections/dashboard-header.html"
            "common-sections/control-panel-header.php"
            "common-sections/fx.php"
            "create_tables.php"
            "assets/scripts/fx.js"
            "assets/stylesheets/dashboard.css"
            "assets/stylesheets/control-panel.css"
            "dashboard/app.php"
            "dashboard/fund/transfer/index.php"
            "dashboard/accounts/create/index.php"
            "dashboard/index.php"
            "dashboard/accounts/transactions/index.php"
            "dashboard/accounts/index.php"
            "control-panel/app.php"
            "control-panel/index.php"
            "control-panel/accounts/index.php"
            "control-panel/transactions/index.php"
          )

          for relative_path in "${core_files[@]}"; do
            [ -f "$relative_path" ] || continue
            remote_path="$LIVE_APP_ROOT/$relative_path"
            remote_parent="$(dirname "$remote_path")"
            ssh -n -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$remote_parent\""
            scp -q -P "$SSH_PORT" "$relative_path" "$SSH_USER@$SSH_HOST:$remote_path" </dev/null
            echo "Synced: $relative_path"
          done

      - name: Run safe database migrations
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd '$LIVE_APP_ROOT'; php create_tables.php >/tmp/velmora-migrate.log 2>&1 || { cat /tmp/velmora-migrate.log; rm -f /tmp/velmora-migrate.log; exit 1; }; grep -E 'Success|Finished with errors' /tmp/velmora-migrate.log || true; rm -f /tmp/velmora-migrate.log"

      - name: Verify customer auth schema
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/velmora-auth-schema.php" <<'PHP'
          <?php
          require getcwd() . '/common-sections/app.php';
          $db = connectToDatabase();
          $r = $db->query("SHOW COLUMNS FROM users LIKE 'session_version'");
          if (!$r || $r->num_rows !== 1) {
              fwrite(STDERR, "Missing users.session_version\n");
              exit(1);
          }
          $r = $db->query("SHOW TABLES LIKE 'customer_remember_tokens'");
          if (!$r || $r->num_rows !== 1) {
              fwrite(STDERR, "Missing customer_remember_tokens\n");
              exit(1);
          }
          echo "CUSTOMER_AUTH_SCHEMA=READY\n";
          PHP
          scp -q -P "$SSH_PORT" "$RUNNER_TEMP/velmora-auth-schema.php" "$SSH_USER@$SSH_HOST:velmora-auth-schema.php"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd '$LIVE_APP_ROOT'; php '$HOME/velmora-auth-schema.php'; rm -f '$HOME/velmora-auth-schema.php'"

      - name: Reset PHP web cache
        run: |
          set -euo pipefail
          nonce="$(openssl rand -hex 24)"
          echo "::add-mask::$nonce"
          reset_name="velmora-opcache-$nonce.php"

          cat > "$RUNNER_TEMP/velmora-opcache-reset.php" <<'PHP'
          <?php
          $ok = function_exists('opcache_reset') ? opcache_reset() : true;
          echo $ok ? 'OK' : 'FAIL';
          PHP

          scp -q -P "$SSH_PORT" "$RUNNER_TEMP/velmora-opcache-reset.php" "$SSH_USER@$SSH_HOST:$LIVE_APP_ROOT/login/$reset_name"
          result="$(curl -fsSL --max-time 30 "https://velmorabank.us/login/$reset_name?cb=$nonce")"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -f '$LIVE_APP_ROOT/login/$reset_name'"

          if [ "$result" != "OK" ]; then
            echo "PHP web cache reset failed."
            exit 1
          fi
          echo "PHP_WEB_CACHE_RESET=YES"

      - name: Verify live login page
        run: |
          set -euo pipefail
          verify_nonce="$(date +%s%N)"
          body="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://velmorabank.us/login/?cb=$verify_nonce")"
          if printf '%s' "$body" | grep -Eqi 'Fatal error|Access denied for user|mysqli_sql_exception'; then
            echo "Live login page still has a database fatal error."
            exit 1
          fi
          echo "LIVE_LOGIN_OK=YES"

      - name: Smoke test review routes
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/login/"
            "/signup/"
            "/personal/"
            "/business/"
            "/credit-card/"
            "/loan/"
            "/online-banking/"
            "/international/"
            "/about-us/"
            "/contact/"
            "/atm-and-bank-locations/"
            "/support/"
            "/security/"
            "/rates/"
            "/documents/"
            "/legal/"
            "/privacy/"
            "/terms/"
            "/cookie-policy/"
            "/accessibility/"
          )
          for route in "${routes[@]}"; do
            nonce="$(date +%s%N)"
            body="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://velmorabank.us${route}?cb=${nonce}")"
            if printf '%s' "$body" | grep -Eqi 'Fatal error|Access denied for user|mysqli_sql_exception'; then
              echo "Runtime failure detected at $route"
              exit 1
            fi
            if printf '%s' "$body" | grep -Eqi 'DEMO ENVIRONMENT|DEMO OPERATIONS|Demo environment|current demo|review version|approved data required|fake downloads'; then
              echo "Pre-launch wording remains at $route"
              exit 1
            fi
            echo "SMOKE_OK=$route"
          done
