name: Deploy full site to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-upload-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload all site files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /velmorabank.us/htdocs
        run: |
          set -euo pipefail

          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing FTP secrets"
            exit 1
          fi

          echo "Uploading full site contents to ftp://$FTP_SERVER$REMOTE_DIR/"

          find . \
            -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.vscode/*' \
            ! -path './node_modules/*' \
            -print0 |
          while IFS= read -r -d '' file; do
            relative_path="${file#./}"
            remote_path="$REMOTE_DIR/$relative_path"
            remote_dir="$(dirname "$remote_path")"

            echo "Uploading: $relative_path -> $remote_path"
            curl --silent --show-error --fail \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs \
              -T "$file" \
              "ftp://$FTP_SERVER$remote_dir/"
          done
