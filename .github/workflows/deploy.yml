name: Deploy changed site files to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-upload-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: 66.29.148.167
          SSH_PORT: "21098"
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_PRIVATE_KEY secret is missing or empty"
            exit 1
          fi

          mkdir -p ~/.ssh

          case "$SSH_PRIVATE_KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-*)
              echo "SSH_PRIVATE_KEY contains a PUBLIC key. GitHub needs the PRIVATE key."
              exit 1
              ;;
          esac

          # Accept either real multiline secrets or secrets pasted with literal \\n characters.
          if [[ "$SSH_PRIVATE_KEY" == *'\\n'* ]]; then
            printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          else
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github-deploy
          fi
          chmod 600 ~/.ssh/github-deploy

          if ! grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----

      - name: Test SSH connection
        env:
          SSH_HOST: 66.29.148.167
          SSH_PORT: "21098"
          SSH_USER: mvlgebybsy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github-deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST"             'echo "SSH connection successful"'

      - name: Upload changed site files
        env:
          SSH_HOST: 66.29.148.167
          SSH_PORT: "21098"
          SSH_USER: mvlgebybsy
          REMOTE_DIR: /home/mvlgebybsy/velmorabank.us
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" --             ':(exclude).git/**'             ':(exclude).github/**'             ':(exclude).vscode/**'             ':(exclude)node_modules/**'             ':(exclude)archive/**')"

          if [ -z "$changed_files" ]; then
            echo "No changed deployable files to upload."
            exit 0
          fi

          while IFS= read -r relative_path; do
            [ -z "$relative_path" ] && continue
            [ -f "$relative_path" ] || continue

            remote_path="$REMOTE_DIR/$relative_path"
            remote_dir="$(dirname "$remote_path")"

            echo "Uploading: $relative_path -> $remote_path"
            ssh -i ~/.ssh/github-deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"               "mkdir -p \"$remote_dir\""
            scp -q -i ~/.ssh/github-deploy -P "$SSH_PORT"               "$relative_path" "$SSH_USER@$SSH_HOST:$remote_path"
          done <<< "$changed_files"
 ~/.ssh/github-deploy; then
            echo "SSH_PRIVATE_KEY is not in a recognized private-key format."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/github-deploy >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is present but malformed or not a usable OpenSSH private key."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: 66.29.148.167
          SSH_PORT: "21098"
          SSH_USER: mvlgebybsy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github-deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST"             'echo "SSH connection successful"'

      - name: Upload changed site files
        env:
          SSH_HOST: 66.29.148.167
          SSH_PORT: "21098"
          SSH_USER: mvlgebybsy
          REMOTE_DIR: /home/mvlgebybsy/velmorabank.us
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" --             ':(exclude).git/**'             ':(exclude).github/**'             ':(exclude).vscode/**'             ':(exclude)node_modules/**'             ':(exclude)archive/**')"

          if [ -z "$changed_files" ]; then
            echo "No changed deployable files to upload."
            exit 0
          fi

          while IFS= read -r relative_path; do
            [ -z "$relative_path" ] && continue
            [ -f "$relative_path" ] || continue

            remote_path="$REMOTE_DIR/$relative_path"
            remote_dir="$(dirname "$remote_path")"

            echo "Uploading: $relative_path -> $remote_path"
            ssh -i ~/.ssh/github-deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"               "mkdir -p \"$remote_dir\""
            scp -q -i ~/.ssh/github-deploy -P "$SSH_PORT"               "$relative_path" "$SSH_USER@$SSH_HOST:$remote_path"
          done <<< "$changed_files"
